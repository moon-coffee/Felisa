<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <style>html,body{background:#252525}</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <div class="container" id="container">
        <div class="form-container create-account">
            <form class="form" id="LoginForm" novalidate>
                <img src="Images/logo.png" alt="Logo" class="logo">
                <p>Alpha v0.0.1</p>
                <h1>Felisaにログイン</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i
                    class="fa-brands 
                    fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i
                    class="fa-brands 
                    fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i
                    class="fa-brands 
                    fa-github"></i></a>
                    <a href="#" class="icon"><i
                    class="fa-brands 
                    fa-linkedin-in"></i></a>
                </div>
            <div class="input-group">
                <input type="text" placeholder="メールアドレスまたはユーザーID" id="login-mailoruserid" required>
                <label for="login-mailoruserid">メールアドレスまたはユーザーID</label>
                <span class="error-message" id="login-mail-error"></span>
            </div>
            <div class="input-group">
                <input type="password" placeholder="パスワード" id="login-password" required>
                <label for="login-password">パスワード</label>
                <span class="error-message" id="login-password-error"></span>
            </div>
            <button type="submit" id="login-button">ログイン</button>
            <span class="error-message" id="login-form-message"></span>
            <p>アカウントをお持ちでない場合は、<a href="/signin">こちら</a>から登録してください。</p>
            </form>
        </div>
    <script src="js/login.js"></script>
</body>

</html>
